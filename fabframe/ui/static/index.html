<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="fabframe-token" content="__FABFRAME_TOKEN__">
  <title>fabframe</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.8v14.4a.8.8 0 0 0 1.2.7l11.3-7.2a.8.8 0 0 0 0-1.4L8.2 4.1A.8.8 0 0 0 7 4.8z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4.5" width="4" height="15" rx="1" fill="currentColor"/><rect x="14" y="4.5" width="4" height="15" rx="1" fill="currentColor"/></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><path d="M8.5 7 3.5 12l5 5M15.5 7l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m4.5 12.5 5 5 10-11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="15" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M5 20V11M12 20V5M19 20v-7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11m-4.5-4.5L12 15l4.5-4.5M5 19.5h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M10 7V5h4v2M6.5 7l1 12.5h9l1-12.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></symbol>
    <symbol id="i-side" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M14.5 4.5v15" stroke="currentColor" stroke-width="1.9"/></symbol>
    <symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></symbol>
    <symbol id="i-lot" viewBox="0 0 24 24"><path d="M12 3.5 20 8v8l-8 4.5L4 16V8z M4 8l8 4.5L20 8M12 12.5v8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-speed" viewBox="0 0 24 24"><path d="M4.5 17a8 8 0 1 1 15 0" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="m12 13 4-4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4 21 19.5H3z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M12 10v4.5M12 17v.3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-stack" viewBox="0 0 24 24"><path d="m12 4 8.5 4.5L12 13 3.5 8.5z M3.5 12.5 12 17l8.5-4.5M3.5 16.5 12 21l8.5-4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-restart" viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2.1-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M5 4.5V9h4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M11.5 6.5 5 12l6.5 5.5zM19 6.5 12.5 12l6.5 5.5z" fill="currentColor"/></symbol>
    <symbol id="i-fwd" viewBox="0 0 24 24"><path d="M12.5 6.5 19 12l-6.5 5.5zM5 6.5 11.5 12 5 17.5z" fill="currentColor"/></symbol>
    <symbol id="i-hq" viewBox="0 0 24 24"><path d="M12 3.5l1.9 5.1 5.1 1.9-5.1 1.9L12 17.5l-1.9-5.1L5 10.5l5.1-1.9zM18.5 15l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z" fill="currentColor"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13.4 2.6 4.6 13.4a.6.6 0 0 0 .47.98H11l-1.1 7.1c-.1.62.7.95 1.08.45l8.8-10.8a.6.6 0 0 0-.47-.98H13l1.12-7.1c.1-.62-.7-.95-1.08-.45z" fill="currentColor"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.4-5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M4.2 4.2v4.6h4.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5M6.5 10v9h11v-9" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>

  <header class="bar">
    <div class="logo">fab<b>frame</b></div>
    <div class="bar-right">
      <span id="kernel" class="kstat" role="img" aria-label="Kernel">●</span>
      <button id="theme" class="ib" type="button" title="Sáng / tối" aria-label="Đổi sáng tối"><svg><use href="#i-theme"/></svg></button>
      <button id="toggle-side" class="ib" type="button" title="Bảng điều khiển" aria-label="Ẩn hiện bảng điều khiển" aria-expanded="true"><svg><use href="#i-side"/></svg></button>
    </div>
  </header>

  <main class="app" id="app">
    <section class="stage" id="stage" aria-label="Nhà máy 3D">
      <div id="canvas-host" class="canvas-host"></div>
      <div id="labels" class="labels" aria-hidden="true"></div>

      <div class="hud hud-kpi" id="hud-kpi">
        <div class="pill" title="Lot hoàn tất"><svg><use href="#i-lot"/></svg><b id="k-done">–</b><small>xong</small></div>
        <div class="pill" title="Lot hoàn tất mỗi ngày"><svg><use href="#i-speed"/></svg><b id="k-rate">–</b><small>/ngày</small></div>
        <div class="pill" title="Vi phạm thời gian chờ CQT"><svg><use href="#i-alert"/></svg><b id="k-cqt">–</b><small>CQT</small></div>
        <div class="pill" title="Lot đang trong nhà máy"><svg><use href="#i-stack"/></svg><b id="k-wip">–</b><small>WIP</small></div>
      </div>

      <div class="hud hud-legend" id="hud-legend" aria-label="Chú giải">
        <div class="lg" title="Bình thường: nóc sáng, đèn tháp xanh lá (tầng 2)"><i class="dot st1"></i><span>Bận</span><b id="c1"></b></div>
        <div class="lg" title="Nóc tối, thân xám hơn, đèn tháp tắt: máy đang rảnh"><i class="dot st0"></i><span>Rảnh</span><b id="c0"></b></div>
        <div class="lg" title="Máy vàng, nóc vàng, đèn vàng (tầng 3): đang đổi cấu hình"><i class="dot st2"></i><span>Setup</span><b id="c2"></b></div>
        <div class="lg" title="Máy xanh dương, nóc kẻ lưới, đèn xanh dương (tầng dưới cùng): bảo trì định kỳ"><i class="dot st3"></i><span>Bảo trì</span><b id="c3"></b></div>
        <div class="lg" title="Máy đỏ, nóc đỏ sọc đen, đèn đỏ (tầng trên cùng): máy hỏng"><i class="dot st4"></i><span>Hỏng</span><b id="c4"></b></div>
        <div class="lg sep" title="FOUP chờ trên kệ trước mỗi khu; lot ở trạm trễ nằm trong stocker giữa lối đi"><i class="foup-ico"></i><span>Lot chờ</span></div>
        <div class="lg" title="Xe OHT chở FOUP trên ray trần: từ kệ tới máy (đặt xuống cổng nạp đúng lúc máy bắt đầu), từ máy tới kệ khu kế tiếp, stocker hoặc cổng XONG. Minh hoạ: kernel không mô phỏng thời gian vận chuyển"><i class="oht-ico"></i><span>Lot đang chuyển</span></div>
      </div>

      <div class="hud-tools">
        <button id="home" class="ib" type="button" title="Về góc nhìn ban đầu" aria-label="Về góc nhìn ban đầu"><svg><use href="#i-home"/></svg></button>
        <button id="quality" class="ib" type="button" title="Chất lượng hình: cao" aria-label="Chất lượng hình"><svg><use href="#i-hq"/></svg><small id="quality-label">Cao</small></button>
      </div>

      <div class="hud-hint" id="hint"></div>

      <div class="player" id="player" hidden>
        <button id="restart" class="ib" type="button" title="Về đầu (Home)" aria-label="Về đầu"><svg><use href="#i-restart"/></svg></button>
        <button id="back" class="ib" type="button" title="Lùi 1 giờ (←) · Shift: 1 ngày" aria-label="Lùi 1 giờ"><svg><use href="#i-back"/></svg></button>
        <button id="play" class="ib play" type="button" aria-label="Phát" title="Phát / dừng (Space)"><svg><use href="#i-play"/></svg></button>
        <button id="fwd" class="ib" type="button" title="Tiến 1 giờ (→) · Shift: 1 ngày" aria-label="Tiến 1 giờ"><svg><use href="#i-fwd"/></svg></button>
        <input id="scrub" type="range" min="0" max="1000" step="1" value="0" aria-label="Thời gian mô phỏng">
        <span id="clock" class="clock">–</span>
        <button id="speed" class="chipbtn" type="button" title="Tốc độ phát (↑ ↓)" aria-label="Tốc độ phát" aria-haspopup="true" aria-expanded="false"><svg><use href="#i-bolt"/></svg><span id="speed-chip">30p/s</span></button>
        <div id="speed-pop" class="speed-pop" hidden role="group" aria-label="Tốc độ phát">
          <div class="spd-head">
            <svg class="spd-bolt" aria-hidden="true"><use href="#i-bolt"/></svg>
            <button id="speed-more" class="spd-title" type="button" aria-expanded="false" aria-controls="speed-adv" title="Chiều phát, số chính xác, mức nhanh">
              <span class="spd-name"><span id="speed-name">Nhanh</span><svg aria-hidden="true"><use href="#i-chev"/></svg></span>
              <span id="speed-sub" class="spd-sub">30 phút mô phỏng mỗi giây</span>
            </button>
            <button id="speed-reset" class="ib" type="button" title="Về mặc định: 30 phút mỗi giây, phát tiến" aria-label="Về tốc độ mặc định"><svg><use href="#i-reset"/></svg></button>
          </div>
          <div class="spd-slider" id="speed-slider">
            <div class="spd-fill"></div>
            <input id="speed-range" type="range" min="0" max="1000" step="1" aria-label="Tốc độ phát">
          </div>
          <div id="speed-adv" class="spd-adv" hidden>
            <div class="seg dir" role="radiogroup" aria-label="Chiều phát">
              <button type="button" role="radio" data-dir="-1" aria-checked="false" title="Phát lùi"><svg><use href="#i-back"/></svg></button>
              <button type="button" role="radio" data-dir="1" aria-checked="true" title="Phát tiến"><svg><use href="#i-fwd"/></svg></button>
            </div>
            <div class="speed-num">
              <input id="speed-val" type="number" min="0.1" step="any" aria-label="Giá trị tốc độ">
              <select id="speed-unit" aria-label="Đơn vị">
                <option value="1">giây</option><option value="60">phút</option><option value="3600">giờ</option><option value="86400">ngày</option>
              </select>
              <span class="muted">/ giây</span>
            </div>
            <div class="speed-chips" id="speed-chips">
              <button type="button" data-v="1">×1</button><button type="button" data-v="60">1p</button>
              <button type="button" data-v="600">10p</button><button type="button" data-v="3600">1h</button>
              <button type="button" data-v="21600">6h</button><button type="button" data-v="86400">1n</button>
            </div>
          </div>
        </div>
      </div>

      <div class="tip" id="tip" hidden></div>
    </section>

    <aside class="side" id="side" aria-label="Điều khiển">
      <div class="block">
        <div class="disp-row">
          <select id="disp" aria-label="Dispatcher"></select>
          <button id="b-code" class="ib" type="button" title="Xem / sửa code" aria-label="Code"><svg><use href="#i-code"/></svg></button>
          <button id="b-new" class="ib" type="button" title="Viết dispatcher mới" aria-label="Viết mới"><svg><use href="#i-plus"/></svg></button>
          <button id="b-check" class="ib" type="button" title="Kiểm tra nhanh" aria-label="Kiểm tra nhanh"><svg><use href="#i-check"/></svg></button>
        </div>
        <div id="check-out" class="check-out" hidden></div>

        <div class="seg" role="radiogroup" aria-label="Dữ liệu">
          <button type="button" role="radio" data-ds="HVLM" aria-checked="true" title="Nhiều lot, ít loại">HVLM</button>
          <button type="button" role="radio" data-ds="LVHM" aria-checked="false" title="Ít lot, nhiều loại">LVHM</button>
        </div>

        <div class="seg" role="radiogroup" aria-label="Thiết lập">
          <button type="button" role="radio" data-preset="quick" aria-checked="true" title="7 ngày, không warm-up — thử code nhanh (khoảng nửa phút)">Nhanh · 7n</button>
          <button type="button" role="radio" data-preset="standard" aria-checked="false" title="Warm-up 60 ngày (FIFO, không tính KPI) + đo 365 ngày — để so sánh luật (HVLM khoảng 35 phút mỗi lần chạy)">Chuẩn · 60+365n</button>
        </div>

        <div class="nums">
          <label class="num" title="Số ngày mô phỏng"><input id="f-days" type="number" min="0.05" max="365" step="0.05" value="7" aria-label="Số ngày"><span>ngày</span></label>
          <label class="num" title="Seed (kịch bản ngẫu nhiên)"><span>#</span><input id="f-seed" type="number" min="0" step="1" value="0" aria-label="Seed"></label>
          <button id="b-adv" class="ib" type="button" title="Thêm tuỳ chọn" aria-label="Thêm tuỳ chọn" aria-expanded="false"><svg><use href="#i-sliders"/></svg></button>
        </div>
        <div id="adv" class="adv" hidden>
          <label class="num" title="Chạy FIFO trước, không tính KPI"><span>warm-up</span><input id="f-warmup" type="number" min="0" max="365" step="0.5" value="0" aria-label="Warm-up"><span>ngày</span></label>
          <label class="num" title="Ngẫu nhiên theo sự kiện: đổi dispatcher không đổi sự cố nhà máy"><span>RNG</span>
            <select id="f-rng" aria-label="RNG"><option value="semantic">sự kiện</option><option value="legacy">gốc</option></select></label>
          <label class="num wide" title="Tham số cho dispatcher, ví dụ k=3"><span>tham số</span><input id="f-options" type="text" placeholder="k=3" autocomplete="off" spellcheck="false" aria-label="Tham số"></label>
        </div>

        <button id="b-run" class="run-btn" type="button"><svg><use href="#i-play"/></svg><span>Chạy</span></button>
        <div id="run-msg" class="msg" role="status"></div>
      </div>
      <div class="runs" id="runs" aria-label="Các lần chạy"></div>
    </aside>
  </main>

  <dialog id="dlg-code" class="dlg" aria-label="Code dispatcher">
    <div class="dlg-head">
      <input id="ed-name" class="ed-name" type="text" maxlength="41" spellcheck="false" autocomplete="off" aria-label="Tên file">
      <span id="ed-ro" class="muted small">chỉ xem</span>
      <button class="ib" type="button" data-close aria-label="Đóng"><svg><use href="#i-x"/></svg></button>
    </div>
    <textarea id="ed-code" class="code" spellcheck="false" wrap="off" aria-label="Code"></textarea>
    <div class="dlg-foot">
      <div id="ed-out" class="check-out" hidden></div>
      <div class="row">
        <button id="ed-copy" class="btn" type="button">Sao chép để sửa</button>
        <button id="ed-save" class="btn" type="button">Lưu</button>
        <button id="ed-check" class="btn primary" type="button"><svg><use href="#i-check"/></svg>Lưu &amp; kiểm tra</button>
      </div>
    </div>
  </dialog>

  <dialog id="dlg-detail" class="dlg wide" aria-label="Chi tiết lần chạy">
    <div class="dlg-head">
      <b id="dt-title" class="dt-title"></b>
      <span id="dt-meta" class="muted small"></span>
      <a id="dt-json" class="ib" title="Tải JSON" aria-label="Tải JSON"><svg><use href="#i-download"/></svg></a>
      <button class="ib" type="button" data-close aria-label="Đóng"><svg><use href="#i-x"/></svg></button>
    </div>
    <div id="dt-body" class="dt-body"></div>
  </dialog>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
